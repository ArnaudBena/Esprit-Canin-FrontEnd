name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract package name and version
        id: package-info
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the Docker image
        run: |
          docker build -t arnaudbena/esprit-canin-frontend .
          docker push arnaudbena/esprit-canin-frontend

      - name: Tag and push the Docker image
        run: |
          docker tag arnaudbena/esprit-canin-frontend arnaudbena/esprit-canin-frontend:${{ env.VERSION }}
          docker push arnaudbena/esprit-canin-frontend:${{ env.VERSION }}
