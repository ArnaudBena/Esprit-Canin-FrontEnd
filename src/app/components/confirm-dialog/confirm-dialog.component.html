@if (config(); as cfg) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    (click)="onCancel()">
    <div
      class="w-full max-w-md rounded-xl border border-bordure bg-blanc p-6 shadow-xl"
      (click)="$event.stopPropagation()">
      <h2 class="mb-2 text-lg font-semibold text-texte">{{ cfg.titre }}</h2>
      <p class="mb-6 text-sm text-muted">{{ cfg.message }}</p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-md border border-bordure bg-blanc px-4 py-2 text-sm font-medium text-texte transition hover:bg-fond">
          {{ cfg.annulerLabel ?? 'Annuler' }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [class]="cfg.danger
            ? 'rounded-md bg-alerte px-4 py-2 text-sm font-bold text-blanc transition hover:bg-alerte/90'
            : 'rounded-md bg-primaire px-4 py-2 text-sm font-medium text-blanc transition hover:bg-primaire/90'">
          {{ cfg.confirmationLabel ?? 'Confirmer' }}
        </button>
      </div>
    </div>
  </div>
}
