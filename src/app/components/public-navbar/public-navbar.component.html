<nav class="bg-primaire">
  <div class="flex h-[72px] items-center justify-between px-6 lg:h-[90px] lg:px-20">
    <!-- Logo -->
    <a routerLink="/" class="flex flex-shrink-0 items-center" aria-label="Accueil Esprit Canin">
      <img src="/logo.svg" alt="" class="h-9 w-auto lg:h-11" />
    </a>

    <!-- Liens (desktop) -->
    <div class="hidden items-center gap-9 md:flex">
      <a routerLink="/" class="text-white/85 hover:text-blanc">Découvrir</a>
      <a routerLink="/seances" class="text-white/85 hover:text-blanc">Séances</a>
      <a routerLink="/a-propos" class="text-white/85 hover:text-blanc">À propos</a>
    </div>

    <!-- Actions (desktop) -->
    <div class="hidden items-center gap-3.5 md:flex">
      <a routerLink="/login"
         class="rounded-sm border-[1.5px] border-white/80 px-5 py-2 font-medium text-blanc hover:bg-white/10">
        Connexion
      </a>
      <a routerLink="/inscription"
         class="rounded-sm bg-accent px-5 py-2 font-medium text-accent-text hover:opacity-90">
        S'inscrire
      </a>
    </div>

    <!-- Burger (mobile) -->
    <button
      type="button"
      (click)="toggleMenuMobile()"
      class="text-blanc md:hidden"
      [attr.aria-label]="menuMobileOuvert() ? 'Fermer le menu' : 'Ouvrir le menu'"
      [attr.aria-expanded]="menuMobileOuvert()"
      aria-controls="menu-mobile"
    >
      <lucide-icon [img]="menuMobileOuvert() ? iconClose : iconMenu" class="h-6 w-6"></lucide-icon>
    </button>
  </div>

  <!-- Panneau mobile -->
  @if (menuMobileOuvert()) {
    <div id="menu-mobile" class="border-t border-white/15 px-6 py-4 md:hidden">
      <div class="flex flex-col">
        <a routerLink="/" (click)="fermerMenuMobile()" class="py-2 text-white/85 hover:text-blanc">Découvrir</a>
        <a routerLink="/seances" (click)="fermerMenuMobile()" class="py-2 text-white/85 hover:text-blanc">Séances</a>
        <a routerLink="/a-propos" (click)="fermerMenuMobile()" class="py-2 text-white/85 hover:text-blanc">À propos</a>
      </div>
      <div class="mt-3 flex flex-col gap-2.5 border-t border-white/15 pt-3">
        <a routerLink="/login" (click)="fermerMenuMobile()"
           class="rounded-sm border-[1.5px] border-white/80 px-5 py-2 text-center font-medium text-blanc hover:bg-white/10">
          Connexion
        </a>
        <a routerLink="/inscription" (click)="fermerMenuMobile()"
           class="rounded-sm bg-accent px-5 py-2 text-center font-medium text-accent-text hover:opacity-90">
          S'inscrire
        </a>
      </div>
    </div>
  }
</nav>
