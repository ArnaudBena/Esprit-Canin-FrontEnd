<div class="mb-6 md:mb-8 flex items-center justify-between gap-3">
  <h1 class="text-xl md:text-2xl font-semibold text-texte">Modifier le rôle</h1>
  <a [routerLink]="['/admin/utilisateurs', id]"
     class="hidden sm:inline-block rounded-md border border-bordure bg-blanc px-4 py-2 text-sm font-medium text-texte transition hover:bg-fond">
    Annuler
  </a>
</div>
<div class="max-w-xl rounded-xl border border-bordure bg-blanc p-4 md:p-6">
  @if (utilisateur(); as user) {
    <p class="text-sm text-muted mb-5">
      Modification du rôle de
      <strong class="text-texte">{{ user.prenom }} {{ user.nom }}</strong>
      (rôle actuel : <strong class="text-texte">{{ user.role.nom }}</strong>).
    </p>
  }
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label for="roleId" class="text-sm font-medium text-texte">
        Nouveau rôle
      </label>
      <div class="relative">
        <select
          id="roleId"
          formControlName="roleId"
          class="w-full appearance-none rounded-md border border-bordure bg-blanc pl-3 pr-9 py-2 text-sm text-texte outline-none transition focus:border-primaire">
          @for (role of roles(); track role.id) {
            <option [ngValue]="role.id">{{ role.nom }}</option>
          }
        </select>
        <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted"
             xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.06l3.71-3.83a.75.75 0 1 1 1.08 1.04l-4.25 4.39a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06z" clip-rule="evenodd" />
        </svg>
      </div>
      @if (form.controls.roleId.invalid && form.controls.roleId.touched) {
        <p class="text-sm font-bold text-alerte">
          Le rôle est obligatoire.
        </p>
      }
    </div>
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-2">
      <a [routerLink]="['/admin/utilisateurs', id]"
         class="text-center rounded-md border border-bordure bg-blanc px-4 py-2 text-sm font-medium text-texte transition hover:bg-fond">
        Annuler
      </a>
      <button
        type="submit"
        [disabled]="form.invalid || !utilisateur()"
        class="rounded-md bg-primaire px-4 py-2 text-sm font-medium text-blanc transition hover:bg-primaire/90 disabled:cursor-not-allowed disabled:opacity-50">
        Enregistrer
      </button>
    </div>
  </form>
</div>
