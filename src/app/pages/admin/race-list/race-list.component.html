<div class="mb-6 md:mb-8 flex items-center justify-between gap-3">
  <h1 class="text-xl md:text-2xl font-semibold text-texte">Races</h1>
  <a routerLink="/admin/races/new"
    class="flex-shrink-0 rounded-md bg-accent px-3 md:px-4 py-2 text-xs md:text-sm font-semibold text-accent-text transition hover:bg-accent/90">
    + Ajouter une race
  </a>
</div>

@if (races().length === 0) {
  <div class="overflow-hidden rounded-xl border border-bordure bg-blanc">
    <p class="p-6 text-sm text-muted">Aucune race pour le moment.</p>
  </div>
} @else {
  <!-- Desktop: tableau -->
  <div class="hidden md:block overflow-hidden rounded-xl border border-bordure bg-blanc">
    <table class="w-full border-collapse">
      <thead class="bg-fond">
        <tr>
          <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wider text-muted">
            Nom
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase tracking-wider text-muted">
            Actions
          </th>
        </tr>
      </thead>
      <tbody>
        @for (race of races(); track race.id) {
          <tr class="border-t border-bordure transition hover:bg-fond">
            <td class="px-5 py-3.5 text-sm text-texte">{{ race.nom }}</td>
            <td class="px-5 py-3.5">
              <div class="flex justify-end gap-2">
                <a
                  [routerLink]="['/admin/races', race.id, 'edit']"
                  class="rounded-md border border-bordure bg-blanc px-3 py-1.5 text-sm font-bold text-texte text-center transition hover:bg-fond">
                  Modifier
                </a>
                <button
                  type="button"
                  (click)="onDelete(race)"
                  class="rounded-md border border-alerte/30 bg-blanc px-3 py-1.5 text-sm font-bold text-alerte transition hover:bg-alerte/10">
                  Supprimer
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <!-- Mobile: cartes -->
  <div class="md:hidden flex flex-col gap-3">
    @for (race of races(); track race.id) {
      <div class="rounded-xl border border-bordure bg-blanc p-4">
        <p class="text-sm font-semibold text-texte">{{ race.nom }}</p>
        <div class="mt-3 flex gap-2">
          <a
            [routerLink]="['/admin/races', race.id, 'edit']"
            class="flex-1 text-center rounded-md border border-bordure bg-blanc px-3 py-2 text-sm font-bold text-texte transition hover:bg-fond">
            Modifier
          </a>
          <button
            type="button"
            (click)="onDelete(race)"
            class="flex-1 rounded-md border border-alerte/30 bg-blanc px-3 py-2 text-sm font-bold text-alerte transition hover:bg-alerte/10">
            Supprimer
          </button>
        </div>
      </div>
    }
  </div>
}
