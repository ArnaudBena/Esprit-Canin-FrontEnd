<div class="flex min-h-screen flex-col items-center justify-center bg-fond px-6 text-center">
  <div class="flex h-24 w-24 items-center justify-center rounded-full bg-image-bg text-primaire">
    <lucide-icon [img]="iconPatte" class="h-12 w-12"></lucide-icon>
  </div>
  <p class="mt-8 text-7xl font-extrabold text-primaire lg:text-8xl">404</p>
  <h1 class="mt-4 text-2xl font-bold text-texte">Page introuvable</h1>
  <p class="mt-2 max-w-md text-muted">
    La page que vous cherchez n'existe pas ou a été déplacée.
  </p>
  <a [routerLink]="accueilLien()"
     class="mt-8 rounded-sm bg-primaire px-6 py-3 text-sm font-medium text-blanc hover:opacity-90">
    Retour à l'accueil
  </a>
</div>
